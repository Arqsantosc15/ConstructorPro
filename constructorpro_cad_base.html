<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6f8,#10151d);--surface:light-dark(#fff,#1a2230);--surface2:light-dark(#f8fafc,#222d3d);--text:light-dark(#182230,#edf2f7);--muted:light-dark(#64748b,#a4b1c3);--line:light-dark(#dce3ea,#344154);--brand:light-dark(#174c72,#70b8e5);--brand2:light-dark(#e7f2fa,#1f3a50);--good:light-dark(#16845b,#57d4a0);--warn:light-dark(#a16207,#f5c86b);--danger:light-dark(#b42318,#ff8a80)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:18px clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;background:var(--brand);color:white;border-radius:12px;display:grid;place-items:center;font-size:21px;font-weight:800}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 79px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:var(--surface)}.nav-label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.3px;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:var(--brand2);color:var(--brand);font-weight:700}.nav .ico{width:20px;text-align:center;font-size:16px}.aside-note{margin:28px 7px 0;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.aside-note strong{display:block;color:var(--text);margin-bottom:5px}.main{padding:clamp(18px,3vw,36px);min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:23px}.eyebrow{color:var(--brand);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1.2px}.pagehead h2{font-size:27px;letter-spacing:-.8px;margin:4px 0}.pagehead p{margin:4px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.subtle{background:var(--brand2);border-color:transparent;color:var(--brand)}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.stat{display:flex;justify-content:space-between;gap:8px}.stat .label{font-size:12px;color:var(--muted);font-weight:600}.stat .value{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:7px}.stat .hint{font-size:11px;color:var(--muted);margin-top:4px}.stat-icon{width:36px;height:36px;border-radius:10px;background:var(--brand2);color:var(--brand);display:grid;place-items:center}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-title h3{font-size:16px;margin:0}.section-title p{font-size:12px;color:var(--muted);margin:3px 0 0}.cols{grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--surface2)}td{font-size:12px}tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.pill{display:inline-flex;padding:4px 7px;border-radius:6px;background:var(--brand2);color:var(--brand);font-size:10px;font-weight:750}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:var(--brand);border-radius:9px}.breakdown{display:flex;flex-direction:column;gap:13px}.break-row{display:flex;justify-content:space-between;gap:10px;font-size:12px}.break-row span:first-child{color:var(--muted)}.total-box{background:var(--brand2);border-radius:10px;padding:15px;margin-top:16px}.total-box .amount{font-size:26px;font-weight:850;color:var(--brand);letter-spacing:-.7px}.total-box p{font-size:11px;color:var(--muted);margin:3px 0 0}.notice{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));padding:12px 14px;border-radius:10px;color:var(--muted);font-size:12px;margin-bottom:17px}.notice strong{color:var(--text)}.hidden{display:none!important}.inline-edit{max-width:100px;padding:6px 7px}.footer-note{color:var(--muted);font-size:11px;margin-top:18px}.split{display:flex;gap:8px;flex-wrap:wrap}.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.subtabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;border-radius:8px}.subtabs button.active{background:var(--brand2);color:var(--brand);border-color:transparent;font-weight:700}.kpi-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.kpi-line:last-child{border-bottom:0}.kpi-line span{color:var(--muted);font-size:12px}.kpi-line strong{font-size:13px}.file-input{max-width:280px}.cad-drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:var(--surface2)}.cad-drop strong{display:block;font-size:16px;margin:8px 0}.cad-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cad-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.cad-row .muted{font-size:12px}
@media(max-width:950px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;overflow:auto}.nav-label,.aside-note{display:none}.nav{flex-direction:row;min-width:max-content}.nav button{padding:9px 12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}@media(max-width:560px){.topbar{align-items:flex-start;padding:14px}.brand p{max-width:175px}.top-actions .btn span{display:none}.main{padding:17px 13px}.pagehead{flex-direction:column}.pagehead h2{font-size:23px}.stats{gap:9px}.card{padding:14px}.stat .value{font-size:22px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-icon{width:30px;height:30px}}
</style>

<body>
<div class="app" id="app">
<header class="topbar"><div class="brand"><div class="logo">CP</div><div><h1>ConstructorPro</h1><p>Presupuestos · Cubicaciones · Análisis de precios</p></div></div><div class="top-actions"><button class="btn" id="exportJson">⇩ <span>Respaldar datos</span></button><button class="btn primary" id="newProjectTop">＋ <span>Nuevo proyecto</span></button></div></header>
<div class="layout"><aside><div class="nav-label">ESPACIO DE TRABAJO</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Resumen</button><button data-page="projects"><span class="ico">▣</span>Proyectos</button><button data-page="takeoff"><span class="ico">⌁</span>Cubicaciones</button><button data-page="models"><span class="ico">▱</span>Planos y modelos</button><button data-page="apu"><span class="ico">☷</span>Análisis de precios (APU)</button><button data-page="budget"><span class="ico">＄</span>Presupuesto</button><button data-page="materials"><span class="ico">▤</span>Base de precios</button><button data-page="reports"><span class="ico">▧</span>Informes</button></nav><div class="aside-note"><strong>Versión de trabajo</strong>Los datos se guardan en este navegador. Exporta un respaldo regularmente.</div></aside>
<main class="main" id="main"></main></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('es-DO',{style:'currency',currency:state.settings.currency||'DOP',maximumFractionDigits:2}).format(Number(n)||0);const num=n=>new Intl.NumberFormat('es-DO',{maximumFractionDigits:2}).format(Number(n)||0);const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={settings:{currency:'DOP',overhead:10,profit:10,tax:0},materials:[{id:'m1',name:'Block 15 × 20 × 40 cm',unit:'ud',price:45,category:'Albañilería'},{id:'m2',name:'Cemento gris (funda)',unit:'funda',price:490,category:'Albañilería'},{id:'m3',name:'Arena lavada',unit:'m³',price:1850,category:'Agregados'},{id:'m4',name:'Grava',unit:'m³',price:2100,category:'Agregados'},{id:'m5',name:'Hormigón premezclado',unit:'m³',price:7200,category:'Hormigón'},{id:'m6',name:'Varilla 3/8 pulg. × 20 pies',unit:'ud',price:290,category:'Acero'},{id:'m7',name:'Plancha sheetrock 4 × 8 pies',unit:'ud',price:520,category:'Terminaciones'},{id:'m8',name:'Madera 2 × 4 × 12 pies',unit:'ud',price:390,category:'Madera'},{id:'m9',name:'Alambre de amarre',unit:'kg',price:115,category:'Acero'},{id:'m10',name:'Pintura acrílica',unit:'galón',price:950,category:'Terminaciones'}],projects:[{id:'p1',name:'Vivienda de ejemplo',client:'Proyecto demostrativo',location:'República Dominicana',type:'Residencial',area:120,levels:2}],activeProject:'p1',takeoffs:[],apus:[],budget:[]};
let state;try{state=JSON.parse(localStorage.getItem('constructorpro_v1'))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};state={...structuredClone(defaults),...state,settings:{...defaults.settings,...state.settings},materials:state.materials||defaults.materials,projects:state.projects||[],takeoffs:state.takeoffs||[],apus:state.apus||[],budget:state.budget||[]};let page='dashboard';let takeoffType='block';
function save(){localStorage.setItem('constructorpro_v1',JSON.stringify(state))}function activeProject(){return state.projects.find(p=>p.id===state.activeProject)||state.projects[0]}function projectRows(){return state.budget.filter(x=>x.projectId===state.activeProject)}function mat(id){return state.materials.find(m=>m.id===id)}function apu(id){return state.apus.find(a=>a.id===id)}function apuCost(a){return (a.items||[]).reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.price)||0),0)}function lineCost(b){let a=apu(b.apuId);return Number(b.qty||0)*(a?apuCost(a):Number(b.unitPrice||0))}function totals(){let rows=projectRows();let direct=rows.reduce((s,b)=>s+lineCost(b),0),over=direct*(Number(state.settings.overhead)||0)/100,profit=(direct+over)*(Number(state.settings.profit)||0)/100,tax=(direct+over+profit)*(Number(state.settings.tax)||0)/100;return{direct,over,profit,tax,total:direct+over+profit+tax}}
function header(kicker,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div><div class="split">${actions}</div></div>`}function stat(label,value,hint,icon){return `<div class="card stat"><div><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div><div class="stat-icon">${icon}</div></div>`}function projectSelect(){return `<div class="field"><label>Proyecto activo</label><select id="activeProject">${state.projects.map(p=>`<option value="${p.id}" ${p.id===state.activeProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const p=activeProject();const main=$('#main');if(!p&&page!=='projects'){main.innerHTML=header('Inicio','Crea tu primer proyecto','Los presupuestos y cubicaciones se organizan por obra.')+`<div class="card"><div class="empty"><strong>Aún no hay proyectos</strong>Crea un proyecto para empezar a cuantificar materiales.<br><br><button class="btn primary" data-action="new-project">＋ Crear proyecto</button></div></div>`;bind();return}switch(page){case'dashboard':main.innerHTML=dashboard();break;case'projects':main.innerHTML=projectsPage();break;case'takeoff':main.innerHTML=takeoffPage();break;case'models':main.innerHTML=modelsPage();break;case'apu':main.innerHTML=apuPage();break;case'budget':main.innerHTML=budgetPage();break;case'materials':main.innerHTML=materialsPage();break;case'reports':main.innerHTML=reportsPage();break}bind()}
function dashboard(){let p=activeProject(),t=totals(),rows=projectRows();return header('PANEL DE CONTROL','Resumen de obra','Una vista rápida del proyecto activo.',`<button class="btn primary" data-action="new-takeoff">＋ Nueva cubicación</button>`)+`<div class="grid stats">${stat('Presupuesto actual',money(t.total),'Incluye indirectos y beneficio','＄')}${stat('Partidas presupuestadas',rows.length,'En el proyecto activo','☷')}${stat('Materiales en catálogo',state.materials.length,'Precios editables','▤')}${stat('Área del proyecto',`${num(p.area)} m²`,`${p.levels||1} nivel(es)`,'⌂')}</div><div class="grid cols"><section class="card"><div class="section-title"><div><h3>Partidas recientes</h3><p>${esc(p.name)}</p></div><button class="btn small" data-page="budget">Ver presupuesto →</button></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Partida</th><th>Etapa / nivel</th><th class="num">Importe</th></tr></thead><tbody>${rows.slice(-5).reverse().map(b=>`<tr><td><strong>${esc(b.name)}</strong><div class="muted">${num(b.qty)} ${esc(b.unit)}</div></td><td>${esc(b.stage||'Sin etapa')}<div class="muted">${esc(b.level||'General')}</div></td><td class="num">${money(lineCost(b))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Tu presupuesto empieza aquí</strong>Calcula cantidades y agrega partidas al presupuesto.</div>`}</section><section class="card"><div class="section-title"><div><h3>Resumen de costos</h3><p>Distribución del presupuesto</p></div></div><div class="breakdown"><div class="break-row"><span>Costo directo</span><strong>${money(t.direct)}</strong></div><div class="break-row"><span>Gastos indirectos (${state.settings.overhead}%)</span><strong>${money(t.over)}</strong></div><div class="break-row"><span>Beneficio (${state.settings.profit}%)</span><strong>${money(t.profit)}</strong></div><div class="break-row"><span>Impuestos (${state.settings.tax}%)</span><strong>${money(t.tax)}</strong></div></div><div class="total-box"><div class="muted">Total estimado</div><div class="amount">${money(t.total)}</div><p>Moneda: ${state.settings.currency}</p></div></section></div><div class="notice" style="margin-top:16px"><strong>Nota técnica:</strong> los precios iniciales son demostrativos. Verifica precios locales, rendimientos y especificaciones antes de usar un presupuesto para contratar o construir.</div>`}
function projectsPage(){return header('GESTIÓN','Proyectos','Crea obras y define los datos generales.',`<button class="btn primary" data-action="new-project">＋ Nuevo proyecto</button>`)+`<div class="grid cols"><section class="card"><div class="section-title"><h3>Mis proyectos</h3><span class="pill">${state.projects.length} total</span></div>${state.projects.length?state.projects.map(p=>`<div class="kpi-line"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.client||'Sin cliente')} · ${esc(p.location||'Sin ubicación')}</div></div><div class="split"><button class="btn small ${p.id===state.activeProject?'subtle':''}" data-action="select-project" data-id="${p.id}">${p.id===state.activeProject?'Activo':'Abrir'}</button><button class="btn small" data-action="edit-project" data-id="${p.id}">Editar</button></div></div>`).join(''):`<div class="empty">No hay proyectos creados.</div>`}</section><section class="card"><div class="section-title"><h3>Datos del proyecto</h3></div><form id="projectForm"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label>Nombre de la obra *</label><input name="name" required placeholder="Ej. Vivienda unifamiliar"></div><div class="field"><label>Cliente</label><input name="client" placeholder="Nombre del cliente"></div><div class="field"><label>Ubicación</label><input name="location" placeholder="Ciudad, provincia"></div><div class="field"><label>Tipo de obra</label><select name="type"><option>Residencial</option><option>Comercial</option><option>Industrial</option><option>Remodelación</option><option>Otro</option></select></div><div class="field"><label>Área total (m²)</label><input name="area" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Número de niveles</label><input name="levels" type="number" min="1" step="1" value="1"></div></div><div class="form-actions"><button class="btn primary" type="submit">Guardar proyecto</button><button class="btn" type="reset">Limpiar</button></div></form></section></div>`}
function takeoffPage(){let p=activeProject();return header('MEDICIONES','Cubicaciones','Introduce dimensiones para estimar cantidades de obra.',`<button class="btn" data-action="export-takeoffs">⇩ Exportar CSV</button>`)+`<div class="notice"><strong>Cómo funciona:</strong> el cálculo usa las dimensiones y supuestos indicados. Comprueba aberturas, traslapos, anclajes, modulación y planos estructurales. No sustituye el diseño ni la revisión profesional.</div><div class="grid cols"><section class="card"><div class="section-title"><div><h3>Calculadora de cantidades</h3><p>Elige el sistema constructivo</p></div></div><div class="subtabs">${[['block','Muro de block'],['drywall','Sheetrock'],['wood','Pared madera'],['plaster','Empañete'],['slab','Losa de hormigón'],['formwork','Encofrado']].map(([v,l])=>`<button data-takeoff-type="${v}" class="${takeoffType===v?'active':''}">${l}</button>`).join('')}</div><form id="takeoffForm"><div class="form-grid"><div class="field"><label>Nombre / elemento</label><input name="name" value="${({'block':'Muro de block','drywall':'División de sheetrock','wood':'Pared de madera','plaster':'Empañete de pared','slab':'Losa de hormigón','formwork':'Encofrado de losa'})[takeoffType]}" required></div><div class="field"><label>Etapa</label><select name="stage"><option>Cimentación</option><option>Estructura</option><option>Albañilería</option><option>Terminaciones</option><option>Instalaciones</option><option>Exterior</option></select></div>${takeoffFields()}<div class="field"><label>Desperdicio (%)</label><input name="waste" type="number" min="0" max="100" step="0.5" value="${takeoffType==='block'?5:takeoffType==='slab'?3:10}"></div><div class="field"><label>Nivel</label><select name="level">${Array.from({length:Math.max(1,Number(p.levels)||1)},(_,i)=>`<option>Nivel ${i+1}</option>`).join('')}<option>General</option></select></div></div><div class="form-actions"><button class="btn primary" type="submit">Calcular cantidades</button></div></form><div id="takeoffResult"></div></section><section class="card"><div class="section-title"><div><h3>Historial de cubicaciones</h3><p>Resultados guardados para este proyecto</p></div><span class="pill">${state.takeoffs.filter(x=>x.projectId===state.activeProject).length}</span></div>${takeoffList()}</section></div>`}
function takeoffFields(){let common=(name,label,val,unit)=>`<div class="field"><label>${label}</label><input name="${name}" type="number" min="0" step="0.01" value="${val}" required></div>`;switch(takeoffType){case'block':return common('length','Longitud (m)',10,'m')+common('height','Altura (m)',3,'m')+common('openings','Aberturas (m²)',3.5,'m²')+common('blocks','Blocks por m²',12.5,'')+`<div class="field"><label>Mortero por m² (m³)</label><input name="mortar" type="number" min="0" step="0.001" value="0.015"></div>`;case'drywall':return common('length','Longitud de pared (m)',5)+common('height','Altura (m)',2.7)+common('faces','Caras a revestir',2)+common('sheetArea','Área por plancha (m²)',2.97)+common('spacing','Separación montantes (m)',0.406);case'wood':return common('length','Longitud (m)',5)+common('height','Altura (m)',2.7)+common('spacing','Separación montantes (m)',0.406)+common('rails','Soleras horizontales',2)+common('stock','Longitud madera comercial (m)',3.66);case'plaster':return common('length','Longitud (m)',10)+common('height','Altura (m)',3)+common('openings','Aberturas (m²)',2)+common('faces','Número de caras',2)+common('thickness','Espesor (cm)',1.5);case'slab':return common('length','Largo losa (m)',8)+common('width','Ancho losa (m)',6)+common('thickness','Espesor (cm)',12)+common('barSpacing','Separación varillas (cm)',20)+common('barLength','Longitud comercial varilla (m)',6);case'formwork':return common('length','Longitud (m)',8)+common('width','Ancho (m)',6)+common('height','Altura (m)',0.12)+common('boardArea','Área por panel / tabla (m²)',1.2)+common('reuse','Usos de reutilización',3)}return''}
function takeoffList(){let rows=state.takeoffs.filter(x=>x.projectId===state.activeProject).slice().reverse();if(!rows.length)return `<div class="empty"><strong>No hay cubicaciones todavía</strong>Los resultados aparecerán aquí.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Elemento</th><th>Resultado</th><th>Fecha</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.stage)} · ${esc(x.level)}</div></td><td>${esc(x.summary)}</td><td>${esc(x.date)}</td><td><button class="btn small" data-action="add-takeoff-budget" data-id="${x.id}">A presupuesto</button></td></tr>`).join('')}</tbody></table></div>`}
function apuPage(){return header('COSTOS UNITARIOS','Análisis de precios (APU)','Descompón cada partida en materiales, mano de obra y equipos.',`<button class="btn primary" data-action="new-apu">＋ Nuevo APU</button>`)+`<div class="grid cols"><section class="card"><div class="section-title"><h3>Biblioteca de APU</h3><span class="pill">${state.apus.length} análisis</span></div>${state.apus.length?`<div class="table-wrap"><table><thead><tr><th>Partida / unidad</th><th>Componentes</th><th class="num">Costo unitario</th><th></th></tr></thead><tbody>${state.apus.map(a=>`<tr><td><strong>${esc(a.name)}</strong><div class="muted">Unidad: ${esc(a.unit)}</div></td><td>${(a.items||[]).length} recursos</td><td class="num">${money(apuCost(a))}</td><td><button class="btn small" data-action="edit-apu" data-id="${a.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Aún no hay APU</strong>Crea uno para descomponer una unidad de obra.</div>`}</section><section class="card"><div class="section-title"><h3>Editor de APU</h3></div><form id="apuForm"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label>Nombre de partida *</label><input name="name" required placeholder="Ej. Muro de block 15 cm"></div><div class="field"><label>Unidad de pago</label><select name="unit"><option>m²</option><option>m³</option><option>ml</option><option>ud</option><option>kg</option><option>jornal</option></select></div><div class="field"><label>Rendimiento / nota</label><input name="note" placeholder="Ej. por m² de muro"></div></div><div class="section-title" style="margin-top:18px"><h3>Recursos por unidad</h3><button type="button" class="btn small" data-action="add-resource">＋ Recurso</button></div><div id="apuResources"></div><div class="form-actions"><button class="btn primary" type="submit">Guardar APU</button><button class="btn" type="reset" data-action="reset-apu">Limpiar</button></div><div class="total-box"><div class="muted">Costo function materialsPage(){return header('CATÁLOGO','Base de precios','Administra los precios unitarios usados por los APU.',`<button class="btn" data-action="export-materials">⇩ Exportar CSV</button>`)+`<div class="grid cols"><section class="card"><div class="section-title"><h3>Materiales y recursos</h3><span class="pill">${state.materials.length}</span></div><div class="table-wrap"><table><thead><tr><th>Recurso</th><th>Categoría</th><th>Unidad</th><th class="num">Precio</th><th></th></tr></thead><tbody>${state.materials.map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.category||'General')}</td><td>${esc(m.unit)}</td><td class="num">${money(m.price)}</td><td><button class="btn small" data-action="edit-material" data-id="${m.id}">Editar</button></td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="section-title"><h3>Agregar / editar recurso</h3></div><form id="materialForm"><input type="hidden" name="id"><div class="form-grid"><div class="field full"><label>Descripción *</label><input name="name" required placeholder="Nombre del material o recurso"></div><div class="field"><label>Unidad</label><input name="unit" required placeholder="m³, ud, kg..."></div><div class="field"><label>Precio unitario</label><input name="price" type="number" min="0" step="0.01" required value="0"></div><div class="field full"><label>Categoría</label><input name="category" placeholder="Acero, mano de obra, equipo..."></div></div><div class="form-actions"><button class="btn primary" type="submit">Guardar recurso</button><button class="btn" type="reset">Limpiar</button></div></form><p class="footer-note">Los precios iniciales son ejemplos. Introduce precios locales, fecha de actualización y condiciones de compra en tu proceso de trabajo.</p></section></div>`}
function budgetPage(){let rows=projectRows(),t=totals();return header('CONTROL ECONÓMICO','Presupuesto de obra','Partidas por etapa y nivel, con costos unitarios y totales.',`<button class="btn" data-action="export-budget">⇩ Exportar Excel (.xlsx)</button><button class="btn primary" data-action="new-budget">＋ Agregar partida</button>`)+`<div class="card" style="margin-bottom:16px"><div class="form-grid"><div class="field"><label>Proyecto</label><select id="budgetProject">${state.projects.map(p=>`<option value="${p.id}" ${p.id===state.activeProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Buscar partida</label><input id="budgetSearch" placeholder="Filtrar por descripción..."></div></div></div><section class="card"><div class="section-title"><div><h3>Desglose de partidas</h3><p>Haz clic en editar para ajustar cantidad, unidad, etapa o nivel.</p></div><span class="pill">${rows.length} partidas</span></div>${rows.length?`<div class="table-wrap"><table id="budgetTable"><thead><tr><th>Partida</th><th>Etapa / nivel</th><th>Cantidad</th><th>Unidad</th><th class="num">Costo unitario</th><th class="num">Importe</th><th></th></tr></thead><tbody>${rows.map(b=>{let a=apu(b.apuId),unit=a?apuCost(a):Number(b.unitPrice)||0;return `<tr data-search="${esc((b.name+' '+b.stage+' '+b.level).toLowerCase())}"><td><strong>${esc(b.name)}</strong><div class="muted">${a?'APU: '+esc(a.name):'Precio directo'}${b.priceSource?'<br>'+esc(b.priceSource):''}</div></td><td>${esc(b.stage||'General')}<div class="muted">${esc(b.level||'General')}</div></td><td><input class="inline-edit" type="number" min="0" step="0.01" value="${b.qty}" data-edit-budget="qty" data-id="${b.id}"></td><td>${esc(b.unit)}</td><td class="num">${money(unit)}</td><td class="num"><strong>${money(lineCost(b))}</strong></td><td><button class="btn small" data-action="edit-budget" data-id="${b.id}">Editar</button> <button class="btn small danger" data-action="delete-budget" data-id="${b.id}">×</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>Presupuesto vacío</strong>Agrega una partida o envía una cubicación al presupuesto.</div>`}<div class="grid cols" style="margin-top:16px"><div class="card" style="background:var(--surface2)"><div class="section-title"><h3>Parámetros de costos</h3></div><form id="settingsForm"><div class="form-grid"><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${state.settings.currency==='DOP'?'selected':''}>DOP · Peso dominicano</option><option value="USD" ${state.settings.currency==='USD'?'selected':''}>USD · Dólar</option><option value="EUR" ${state.settings.currency==='EUR'?'selected':''}>EUR · Euro</option></select></div><div class="field"><label>Gastos indirectos (%)</label><input name="overhead" type="number" min="0" value="${state.settings.overhead}"></div><div class="field"><label>Beneficio (%)</label><input name="profit" type="number" min="0" value="${state.settings.profit}"></div><div class="field"><label>Impuestos (%)</label><input name="tax" type="number" min="0" value="${state.settings.tax}"></div></div><div class="form-actions"><button class="btn primary" type="submit">Actualizar cálculo</button></div></form></div><div class="card"><div class="section-title"><h3>Resumen</h3></div><div class="breakdown"><div class="break-row"><span>Costo directo</span><strong>${money(t.direct)}</strong></div><div class="break-row"><span>Gastos indirectos</span><strong>${money(t.over)}</strong></div><div class="break-row"><span>Beneficio</span><strong>${money(t.profit)}</strong></div><div class="break-row"><span>Impuestos</span><strong>${money(t.tax)}</strong></div></div><div class="total-box"><div class="muted">Total presupuesto</div><div class="amount">${money(t.total)}</div></div></div></div></section>`}
function modelsPage(){return header('DOCUMENTACIÓN TÉCNICA','Planos y modelos CAD/BIM','Adjunta archivos DWG, SKP y RVT al proyecto activo. Esta primera fase organiza los archivos en este navegador.',`<button class="btn" data-action="exportJson">⇩ Respaldar datos</button>`)+`<div class="notice"><strong>Importante:</strong> esta fase guarda y organiza los archivos, pero todavía no interpreta su geometría ni calcula cubicaciones automáticamente. Para visualizar modelos dentro de la web y extraer cantidades será necesario conectar un servicio de conversión CAD/BIM con servidor.</div><div class="card"><div class="section-title"><div><h3>Agregar archivos</h3><p>Proyecto: ${esc(activeProject()?.name||'—')} · Formatos admitidos: DWG, SKP, RVT</p></div></div><div class="cad-drop"><div style="font-size:30px">📐</div><strong>Selecciona planos y modelos de la obra</strong><p class="muted">Puedes elegir varios archivos a la vez. Se guardan localmente en este navegador.</p><input id="cadFiles" class="file-input" type="file" multiple accept=".dwg,.skp,.rvt,.dxf,.ifc,.pdf" style="margin:10px auto;max-width:100%"><div id="cadUploadStatus" class="muted" aria-live="polite"></div></div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><h3>Archivos del proyecto</h3><p>Descarga o elimina archivos adjuntos a este proyecto.</p></div><span class="pill" id="cadFileCount">Cargando…</span></div><div id="cadFileList"><div class="empty">Cargando archivos guardados…</div></div></div><div class="grid cols" style="margin-top:16px"><div class="card"><h3 style="margin-top:0">Flujo recomendado</h3><div class="kpi-line"><span>DWG</span><strong>Plano 2D → medidas y áreas</strong></div><div class="kpi-line"><span>SKP</span><strong>Modelo 3D → geometría</strong></div><div class="kpi-line"><span>RVT</span><strong>BIM → categorías y cantidades</strong></div><p class="muted" style="font-size:12px">La extracción de cantidades se implementará en una fase posterior, después de configurar el visor y el servicio de procesamiento.</p></div><div class="card"><h3 style="margin-top:0">Privacidad y respaldo</h3><p class="muted">Los archivos se almacenan en IndexedDB del navegador, no se envían a un servidor. Si borras los datos del navegador, podrías perderlos; conserva los originales y usa un respaldo por separado.</p></div></div>`}
const CAD_DB='constructorpro_cad_files_v1';let cadDbPromise;
function cadDb(){if(!('indexedDB' in window))return Promise.reject(new Error('Este navegador no admite almacenamiento local de archivos.'));if(cadDbPromise)return cadDbPromise;cadDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(CAD_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files')){const st=db.createObjectStore('files',{keyPath:'id'});st.createIndex('projectId','projectId',{unique:false})}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir el almacenamiento local.'))});return cadDbPromise}
async function cadStore(record){const db=await cadDb();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('No se pudo guardar el archivo.'))})}
async function cadGetProjectFiles(){const db=await cadDb();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').getAll();req.onsuccess=()=>resolve(req.result.filter(x=>x.projectId===state.activeProject).sort((a,b)=>b.createdAt-a.createdAt));req.onerror=()=>reject(req.error)})}
async function cadDelete(id){const db=await cadDb();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function humanSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';return (bytes/1048576).toFixed(2)+' MB'}
async function renderCadFiles(){const list=$('#cadFileList');if(!list)return;try{const files=await cadGetProjectFiles();const count=$('#cadFileCount');if(count)count.textContent=files.length+' archivo(s)';if(!files.length){list.innerHTML='<div class="empty"><strong>No hay archivos adjuntos</strong>Selecciona un DWG, SKP o RVT para comenzar.</div>';return}list.innerHTML='<div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Archivo</th><th>Formato</th><th>Tamaño</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>'+files.map(f=>`<tr><td><strong>${esc(f.name)}</strong><div class="muted">${esc(f.projectName||'')}</div></td><td><span class="pill">${esc(f.ext.toUpperCase())}</span></td><td>${humanSize(f.size)}</td><td>${new Date(f.createdAt).toLocaleDateString('es-DO')}</td><td><div class="split"><button class="btn small" data-cad-action="download" data-id="${f.id}">Descargar</button><button class="btn small danger" data-cad-action="delete" data-id="${f.id}">Eliminar</button></div></td></tr>`).join('')+'</tbody></table></div>'}catch(e){list.innerHTML=`<div class="notice">No se pudo acceder al almacenamiento local: ${esc(e.message)}. Prueba abrir ConstructorPro en un navegador moderno.</div>`}}
async function uploadCadFiles(fileList){const status=$('#cadUploadStatus');const input=$('#cadFiles');const allowed=['dwg','skp','rvt','dxf','ifc','pdf'];const files=[...fileList];if(!files.length)return;let saved=0,skipped=[];if(status)status.textContent='Guardando archivos localmente…';for(const file of files){const ext=(file.name.split('.').pop()||'').toLowerCase();if(!allowed.includes(ext)){skipped.push(file.name+' (formato no admitido)');continue}try{await cadStore({id:uid()+'_'+Date.now().toString(36),projectId:state.activeProject,projectName:activeProject()?.name||'',name:file.name,ext,size:file.size,type:file.type||'application/octet-stream',createdAt:Date.now(),blob:file});saved++}catch(e){skipped.push(file.name+' (no se pudo guardar: '+e.message+')')}}if(status)status.textContent=`Guardados: ${saved}.`+(skipped.length?' No guardados: '+skipped.join(', '):'');if(input)input.value='';await renderCadFiles()}
async function cadAction(actionName,id){try{const db=await cadDb();const rec=await new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!rec)return;if(actionName==='delete'){if(!confirm('¿Eliminar el archivo '+rec.name+' de este navegador?'))return;await cadDelete(id);await renderCadFiles();return}if(actionName==='download'){const url=URL.createObjectURL(rec.blob);const a=document.createElement('a');a.href=url;a.download=rec.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}}catch(e){alert('No se pudo completar la acción: '+e.message)}}
function reportsPage(){let t=totals(),rows=projectRows(),groups={};rows.forEach(b=>{let k=(b.stage||'General')+' / '+(b.level||'General');groups[k]=(groups[k]||0)+lineCost(b)});return header('DOCUMENTACIÓN','Informes y exportaciones','Prepara entregables para revisión, impresión y respaldo.',`<button class="btn primary" data-action="print-report">⎙ Imprimir / PDF</button>`)+`<div class="grid stats">${stat('Costo directo',money(t.direct),'Suma de partidas','＄')}${stat('Total estimado',money(t.total),'Con indirectos, beneficio e impuestos','▤')}${stat('Partidas',rows.length,'En proyecto activo','☷')}${stat('Cubicaciones',state.takeoffs.filter(x=>x.projectId===state.activeProject).length,'Registros guardados','⌁')}</div><div class="grid cols"><section class="card"><div class="section-title"><div><h3>Resumen por etapa y nivel</h3><p>Importes directos por agrupación</p></div></div>${Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<div class="kpi-line"><span>${esc(k)}</span><strong>${money(v)}</strong></div>`).join(''):`<div class="empty">Agrega partidas para generar el resumen.</div>`}<div class="form-actions"><button class="btn" data-action="export-budget">Exportar partidas CSV</button><button class="btn" data-action="export-takeoffs">Exportar cubicaciones CSV</button></div></section><section class="card"><div class="section-title"><h3>Alcance del informe</h3></div><div class="kpi-line"><span>Proyecto</span><strong>${esc(activeProject()?.name||'—')}</strong></div><div class="kpi-line"><span>Cliente</span><strong>${esc(activeProject()?.client||'—')}</strong></div><div class="kpi-line"><span>Ubicación</span><strong>${esc(activeProject()?.location||'—')}</strong></div><div class="kpi-line"><span>Área declarada</span><strong>${num(activeProject()?.area)} m²</strong></div><div class="notice" style="margin-top:14px;margin-bottom:0">El PDF mediante impresión utiliza el diálogo de impresión del navegador. Selecciona “Guardar como PDF”.</div></section></div>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)));document.querySelectorAll('[data-takeoff-type]').forEach(b=>b.addEventListener('click',()=>{takeoffType=b.dataset.takeoffType;render()}));$('#activeProject')?.addEventListener('change',e=>{state.activeProject=e.target.value;save();render()});$('#budgetProject')?.addEventListener('change',e=>{state.activeProject=e.target.value;save();render()});$('#budgetSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('#budgetTable tbody tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)))});$('#projectForm')?.addEventListener('submit',saveProject);$('#materialForm')?.addEventListener('submit',saveMaterial);$('#apuForm')?.addEventListener('submit',saveApu);$('#takeoffForm')?.addEventListener('submit',calculateTakeoff);$('#settingsForm')?.addEventListener('submit',saveSettings);$('#cadFiles')?.addEventListener('change',e=>uploadCadFiles(e.target.files));document.querySelectorAll('[data-cad-action]').forEach(b=>b.addEventListener('click',()=>cadAction(b.dataset.cadAction,b.dataset.id)));if(page==='models')renderCadFiles();document.querySelectorAll('[data-edit-budget]').forEach(i=>i.addEventListener('change',()=>{let b=state.budget.find(x=>x.id===i.dataset.id);if(b){b[i.dataset.editBudget]=Number(i.value)||0;save();render()}}));$('#exportJson')?.addEventListener('click',exportJson);$('#newProjectTop')?.addEventListener('click',()=>{page='projects';render()});document.querySelectorAll('[data-action="add-resource"]').forEach(b=>b.addEventListener('click',addResource));document.querySelectorAll('[data-resource]').forEach(el=>el.addEventListener('input',updateApuPreview));}
function action(a,id){switch(a){case'new-project':page='projects';render();$('#projectForm')?.reset();break;case'select-project':state.activeProject=id;save();render();break;case'edit-project':{let p=state.projects.find(x=>x.id===id),f=$('#projectForm');if(!p||!f)return;Object.entries(p).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});f.scrollIntoView({behavior:'smooth',block:'center'});break}case'new-takeoff':page='takeoff';render();break;case'new-apu':page='apu';render();addResource();break;case'edit-apu':fillApu(id);break;case'add-resource':addResource();break;case'edit-material':fillMaterial(id);break;case'new-budget':showBudgetEditor();break;case'edit-budget':showBudgetEditor(id);break;case'delete-budget':if(confirm('¿Eliminar esta partida del presupuesto?')){state.budget=state.budget.filter(x=>x.id!==id);save();render()}break;case'add-takeoff-budget':addTakeoffBudget(id);break;case'export-budget':exportBudget();break;case'export-takeoffs':exportTakeoffs();break;case'export-materials':exportMaterials();break;case'print-report':window.print();break;case'exportJson':exportJson();break;case'reset-apu':$('#apuResources').innerHTML='';updateApuPreview();break}}
function formData(f){return Object.fromEntries(new FormData(f).entries())}function saveProject(e){e.preventDefault();let d=formData(e.target);d.area=Number(d.area)||0;d.levels=Math.max(1,Number(d.levels)||1);if(d.id){let i=state.projects.findIndex(p=>p.id===d.id);if(i>=0)state.projects[i]={...state.projects[i],...d}}else{d.id=uid();state.projects.push(d);state.activeProject=d.id}save();render()}
function saveMaterial(e){e.preventDefault();let d=formData(e.target);d.price=Number(d.price)||0;if(d.id){let i=state.materials.findIndex(x=>x.id===d.id);if(i>=0)state.materials[i]={...state.materials[i],...d}}else{d.id=uid();state.materials.push(d)}save();render()}
function fillMaterial(id){let m=mat(id),f=$('#materialForm');if(!m||!f)return;Object.entries(m).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});f.scrollIntoView({behavior:'smooth',block:'center'})}
function addResource(item={}){let wrap=$('#apuResources');if(!wrap)return;let row=document.createElement('div');row.className='form-grid resource-row';row.style.cssText='border-top:1px solid var(--line);padding:10px 0;grid-template-columns:1.4fr .6fr .7fr auto';row.innerHTML=`<div class="field"><label>Recurso</label><select data-resource="material">${state.materials.map(m=>`<option value="${m.id}" ${m.id===item.materialId?'selected':''}>${esc(m.name)}</option>`).join('')}<option value="custom" ${item.materialId==='custom'?'selected':''}>Otro / manual</option></select><input data-resource="customName" class="${item.materialId==='custom'?'':'hidden'}" placeholder="Nombre del recurso" value="${esc(item.name||'')}"></div><div class="field"><label>Cantidad</label><input data-resource="qty" type="number" min="0" step="0.0001" value="${item.qty??1}"></div><div class="field"><label>Precio unitario</label><input data-resource="price" type="number" min="0" step="0.01" value="${item.price??(mat(item.materialId)?.price||0)}"></div><button type="button" class="btn small danger" data-remove-resource style="align-self:end">×</button>`;wrap.appendChild(row);row.querySelector('[data-resource="material"]').addEventListener('change',e=>{let m=mat(e.target.value),custom=row.querySelector('[data-resource="customName"]');custom.classList.toggle('hidden',e.target.value!=='custom');if(m){row.querySelector('[data-resource="price"]').value=m.price}updateApuPreview()});row.querySelector('[data-remove-resource]').addEventListener('click',()=>{row.remove();updateApuPreview()});row.querySelectorAll('input').forEach(x=>x.addEventListener('input',updateApuPreview));updateApuPreview()}
function resourceData(){return [...document.querySelectorAll('.resource-row')].map(r=>{let id=r.querySelector('[data-resource="material"]').value,m=mat(id);return{materialId:id,name:id==='custom'?r.querySelector('[data-resource="customName"]').value:(m?.name||'Recurso'),unit:m?.unit||'ud',qty:Number(r.querySelector('[data-resource="qty"]').value)||0,price:Number(r.querySelector('[data-resource="price"]').value)||0}})}function updateApuPreview(){let el=$('#apuPreview');if(el)el.textContent=money(resourceData().reduce((s,x)=>s+x.qty*x.price,0))}
function saveApu(e){e.preventDefault();let d=formData(e.target);d.items=resourceData();if(!d.items.length){alert('Agrega al menos un recurso al APU.');return}if(d.id){let i=state.apus.findIndex(x=>x.id===d.id);if(i>=0)state.apus[i]={...state.apus[i],...d}}else{d.id=uid();state.apus.push(d)}save();render()}
function fillApu(id){let a=apu(id),f=$('#apuForm');if(!a||!f)return;Object.entries(a).forEach(([k,v])=>{if(k!=='items'&&f.elements[k])f.elements[k].value=v});$('#apuResources').innerHTML='';a.items.forEach(x=>addResource(x));updateApuPreview();f.scrollIntoView({behavior:'smooth',block:'center'})}
function calculateTakeoff(e){
 e.preventDefault();
 let d=formData(e.target),v=Object.fromEntries(Object.entries(d).map(([k,x])=>[k,['name','stage','level'].includes(k)?x:Number(x)])),w=1+(v.waste||0)/100,results={},summary='',type=takeoffType;
 const positive=['length','height','width','blocks','mortar','faces','sheetArea','spacing','rails','stock','thickness','barSpacing','barLength','boardArea','reuse'];
 for(const k of positive){if(k in v && (!Number.isFinite(v[k]) || v[k]<=0)){alert('Revisa el campo "'+k+'": debe ser mayor que cero.');return}}
 if('openings' in v && (!Number.isFinite(v.openings)||v.openings<0)){alert('Las aberturas no pueden ser negativas.');return}
 if(v.waste<0||v.waste>100){alert('El desperdicio debe estar entre 0 y 100 %.');return}
 const add=(k,x,whole=false)=>results[k]=whole?Math.ceil(x):Math.ceil((x-1e-9)*100)/100;
 switch(type){
 case'block':{let gross=v.length*v.height;if(v.openings>gross){alert('Las aberturas no pueden superar el área bruta del muro.');return}let area=Math.max(0,gross-v.openings);add('Área neta (m²)',area);add('Blocks con desperdicio (ud)',area*v.blocks*w,true);add('Mortero estimado (m³)',area*v.mortar*w);summary=`${num(results['Blocks con desperdicio (ud)'])} blocks`;break}
 case'drywall':{let area=v.length*v.height*v.faces;add('Área de planchas (m²)',area);add('Planchas (ud)',area/v.sheetArea*w,true);add('Montantes (ud)',(Math.ceil(v.length/v.spacing)+1),true);summary=`${num(results['Planchas (ud)'])} planchas`;break}
 case'wood':{let studs=Math.ceil(v.length/v.spacing)+1;add('Montantes (ud)',studs*w,true);add('Soleras (ud)',Math.ceil(v.length*v.rails/v.stock*w),true);add('Área de pared (m²)',v.length*v.height);summary=`${num(results['Montantes (ud)'])} montantes`;break}
 case'plaster':{let gross=v.length*v.height;if(v.openings>gross){alert('Las aberturas no pueden superar el área bruta de la pared.');return}let area=Math.max(0,gross-v.openings)*v.faces;add('Área de empañete (m²)',area);add('Volumen mortero (m³)',area*(v.thickness/100)*w);summary=`${num(results['Área de empañete (m²)'])} m²`;break}
 case'slab':{let area=v.length*v.width,vol=area*v.thickness/100;add('Área de losa (m²)',area);add('Hormigón (m³)',vol*w);let nAlongLength=Math.ceil(v.width/(v.barSpacing/100))+1,nAlongWidth=Math.ceil(v.length/(v.barSpacing/100))+1,totalLen=nAlongLength*v.length+nAlongWidth*v.width;add('Longitud de varilla (m)',totalLen*w);add('Varillas comerciales (ud)',Math.ceil(totalLen*w/v.barLength),true);summary=`${num(results['Hormigón (m³)'])} m³ hormigón`;break}
 case'formwork':{let area=v.length*v.width;add('Área de contacto (m²)',area);add('Paneles / tablas (ud)',area/v.boardArea*w,true);summary=`${num(results['Área de contacto (m²)'])} m² encofrado`;break}
 }
 let row={id:uid(),projectId:state.activeProject,name:d.name,stage:d.stage,level:d.level,type,waste:v.waste,results,summary,date:new Date().toLocaleDateString('es-DO'),raw:d};state.takeoffs.push(row);save();let target=$('#takeoffResult');target.innerHTML=`<div class="total-box"><div class="muted">Resultado calculado · ${esc(d.name)}</div>${Object.entries(results).map(([k,x])=>`<div class="break-row" style="margin-top:8px"><span>${esc(k)}</span><strong>${num(x)}</strong></div>`).join('')}<p>Desperdicio aplicado: ${num(v.waste)}%</p><div class="form-actions"><button class="btn primary" type="button" data-action="add-takeoff-budget" data-id="${row.id}">Agregar al presupuesto</button></div></div>`;target.querySelector('[data-action]').addEventListener('click',()=>addTakeoffBudget(row.id));renderTakeoffHistoryOnly()
}
function renderTakeoffHistoryOnly(){let card=[...document.querySelectorAll('.card')].find(c=>c.querySelector('.section-title h3')?.textContent==='Historial de cubicaciones');if(card){let old=card.querySelector('.table-wrap,.empty');if(old)old.outerHTML=takeoffList()}}
function addTakeoffBudget(id){
 let x=state.takeoffs.find(t=>t.id===id);if(!x)return;
 let primary={block:['Blocks con desperdicio (ud)','ud'],drywall:['Planchas (ud)','ud'],wood:['Montantes (ud)','ud'],plaster:['Área de empañete (m²)','m²'],slab:['Hormigón (m³)','m³'],formwork:['Área de contacto (m²)','m²']}[x.type]||[Object.keys(x.results)[0],'ud'];
 let qty=Number(x.results[primary[0]])||0,unit=primary[1];
 let existing=state.budget.find(b=>b.takeoffId===id);if(existing){alert('Esta cubicación ya fue agregada al presupuesto.');return}
 // Prioriza un APU de la misma unidad; si no existe, utiliza un recurso compatible de la base de precios.
 const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const keywords={block:['block','bloque'],drywall:['sheetrock','plancha'],wood:['madera','montante'],plaster:['empanete','empañete','yeso'],slab:['hormigon','concreto'],formwork:['encofrado','formaleta','panel']}[x.type]||[];
 let matchedApu=state.apus.find(a=>a.unit===unit&&keywords.some(k=>norm(a.name).includes(norm(k))));
 if(!matchedApu)matchedApu=state.apus.find(a=>a.unit===unit&&norm(a.name).includes(norm(x.name)));
 let matchedMaterial=null;
 const materialNames={block:['block 15','block','bloque'],drywall:['plancha sheetrock','sheetrock'],wood:['madera 2 × 4','madera'],slab:['hormigon premezclado','hormigon','concreto'],formwork:['madera 2 × 4','madera']}[x.type]||[];
 if(!matchedApu)matchedMaterial=state.materials.find(m=>m.unit===unit&&materialNames.some(k=>norm(m.name).includes(norm(k))));
 let source=matchedApu?'APU de referencia: '+matchedApu.name:matchedMaterial?'Base de precios: '+matchedMaterial.name:'Sin precio compatible; asigna un APU o costo unitario';
 state.budget.push({id:uid(),projectId:x.projectId||state.activeProject,takeoffId:id,name:x.name,stage:x.stage,level:x.level,qty,unit,unitPrice:matchedMaterial?Number(matchedMaterial.price)||0:0,apuId:matchedApu?.id||'',priceSource:source,referenceMaterialId:matchedMaterial?.id||'',note:'Cantidad desde cubicación. Precio tomado como referencia de la base de precios/APU; confirma alcance, unidad y precio vigente.'});
 save();page='budget';render();
}
function showBudgetEditor(id){let old=id?state.budget.find(x=>x.id===id):null;let name=prompt('Descripción de la partida:',old?.name||'Nueva partida');if(!name)return;let qty=Number(prompt('Cantidad:',old?.qty||1));if(!Number.isFinite(qty)||qty<0)return;let unit=prompt('Unidad (m², m³, ml, ud, kg):',old?.unit||'m²')||'ud';let stage=prompt('Etapa:',old?.stage||'Albañilería')||'General';let level=prompt('Nivel:',old?.level||'Nivel 1')||'General';let apuOptions=state.apus.map(a=>a.name+' ['+a.id+']').join('\n');let choice=state.apus.length?prompt('ID de APU para vincular (deja vacío para precio directo):\n'+apuOptions,old?.apuId||''):'';let apuId=state.apus.some(a=>a.id===choice)?choice:'';let unitPrice=apuId?0:Number(prompt('Costo directo unitario:',old?.unitPrice||0));if(old)Object.assign(old,{name,qty,unit,stage,level,apuId,unitPrice});else state.budget.push({id:uid(),projectId:state.activeProject,name,qty,unit,stage,level,apuId,unitPrice});save();render()}
function saveSettings(e){e.preventDefault();let d=formData(e.target);state.settings={...state.settings,currency:d.currency,overhead:Number(d.overhead)||0,profit:Number(d.profit)||0,tax:Number(d.tax)||0};save();render()}
function download(name,content,type='text/csv;charset=utf-8'){let blob=new Blob(['\ufeff'+content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function exportBudget(){
 if(!window.XLSX){alert('No se pudo cargar el módulo de Excel. Comprueba tu conexión a Internet y vuelve a intentarlo.');return}
 const rows=projectRows().map(b=>{const a=apu(b.apuId),unitCost=a?apuCost(a):Number(b.unitPrice)||0;return {...b,unitCost,amount:lineCost(b),priceOrigin:b.priceSource||(a?'APU: '+a.name:(unitCost>0?'Precio directo':'SIN PRECIO ASIGNADO'))}});
 const project=activeProject(),currency=state.settings.currency||'DOP';
 const moneyFmt='"'+currency+' "#,##0.00;[Red]-"'+currency+' "#,##0.00';
 const wb=XLSX.utils.book_new();
 const direct=rows.reduce((sum,r)=>sum+r.amount,0),t=totals();
 const byGroup={}; rows.forEach(r=>{const key=(r.stage||'Sin etapa')+'||'+(r.level||'Sin nivel');if(!byGroup[key])byGroup[key]={stage:r.stage||'Sin etapa',level:r.level||'Sin nivel',count:0,amount:0};byGroup[key].count++;byGroup[key].amount+=r.amount});
 const summary=[['CONSTRUCTORPRO | RESUMEN DE PRESUPUESTO'],['Proyecto',project?.name||'Sin proyecto'],['Cliente',project?.client||''],['Ubicación',project?.location||''],['Fecha de exportación',new Date().toLocaleDateString('es-DO')],['Moneda',currency],[],['RESUMEN POR ETAPA Y NIVEL'],['Etapa','Nivel','Cantidad de partidas','Costo directo']];
 Object.values(byGroup).sort((a,b)=>a.stage.localeCompare(b.stage,'es')||a.level.localeCompare(b.level,'es')).forEach(g=>summary.push([g.stage,g.level,g.count,g.amount]));
 summary.push(['','TOTAL DIRECTO',rows.length,direct],[],['RESUMEN ECONÓMICO','Porcentaje','Importe'],['Costo directo','',t.direct],['Gastos indirectos',Number(state.settings.overhead)||0,t.over],['Beneficio',Number(state.settings.profit)||0,t.profit],['Impuestos',Number(state.settings.tax)||0,t.tax],['TOTAL ESTIMADO','',t.total],[],['Nota','Los precios de referencia deben verificarse antes de usar el presupuesto para contratar o construir.']);
 const ws1=XLSX.utils.aoa_to_sheet(summary);ws1['!cols']=[{wch:34},{wch:25},{wch:22},{wch:20}];ws1['!freeze']={xSplit:0,ySplit:9};
 // Formatos numéricos en resumen
 for(let r=10;r<10+Object.keys(byGroup).length+1;r++){const c='D'+(r+1);if(ws1[c])ws1[c].z=moneyFmt}
 const econIndex=summary.findIndex(r=>r[0]==='Costo directo');
 // Aplicar formatos según la fila real de Excel (los índices de arrays empiezan en cero).
 for(let i=econIndex;i<econIndex+5;i++){const cell='C'+(i+1);if(ws1[cell])ws1[cell].z=moneyFmt}
 ['Gastos indirectos','Beneficio','Impuestos'].forEach(label=>{const i=summary.findIndex(r=>r[0]===label);if(i>=0&&ws1['B'+(i+1)])ws1['B'+(i+1)].z='0.00"%"'});
 const detail=[['N.º','Partida','Etapa','Nivel','Cantidad','Unidad','Costo unitario de referencia','Origen del precio','Importe']];
 const sorted=[...rows].sort((a,b)=>String(a.stage||'').localeCompare(String(b.stage||''),'es')||String(a.level||'').localeCompare(String(b.level||''),'es')||String(a.name||'').localeCompare(String(b.name||''),'es'));
 sorted.forEach((r,i)=>detail.push([i+1,r.name,r.stage||'Sin etapa',r.level||'General',Number(r.qty)||0,r.unit,r.unitCost,r.priceOrigin,r.amount]));
 detail.push(['','','','','','','','TOTAL COSTO DIRECTO',direct]);
 const ws2=XLSX.utils.aoa_to_sheet(detail);ws2['!cols']=[{wch:7},{wch:34},{wch:20},{wch:14},{wch:14},{wch:12},{wch:24},{wch:38},{wch:20}];ws2['!autofilter']={ref:'A1:I'+Math.max(1,detail.length-1)};ws2['!freeze']={xSplit:0,ySplit:1};
 for(let r=2;r<=detail.length;r++){['E','G','I'].forEach(col=>{const c=ws2[col+r];if(c)c.z=col==='E'?'#,##0.00':moneyFmt})}
 const materials=[['Descripción','Categoría','Unidad','Precio unitario','Identificador']];state.materials.forEach(m=>materials.push([m.name,m.category||'General',m.unit,Number(m.price)||0,m.id]));const ws3=XLSX.utils.aoa_to_sheet(materials);ws3['!cols']=[{wch:38},{wch:22},{wch:14},{wch:20},{wch:28}];ws3['!autofilter']={ref:'A1:E'+Math.max(1,materials.length)};ws3['!freeze']={xSplit:0,ySplit:1};for(let r=2;r<=materials.length;r++){if(ws3['D'+r])ws3['D'+r].z=moneyFmt}
 const pending=[['Partida','Etapa','Nivel','Cantidad','Unidad','Precio unitario actual','Importe actual','Qué revisar']];rows.filter(r=>!(r.unitCost>0)).forEach(r=>pending.push([r.name,r.stage||'Sin etapa',r.level||'General',Number(r.qty)||0,r.unit,r.unitCost,r.amount,'Vincular un APU compatible o introducir un costo unitario real.']));if(pending.length===1)pending.push(['No hay partidas sin precio','','','','','','','Revisa que los precios de referencia sean reales y estén actualizados.']);const ws4=XLSX.utils.aoa_to_sheet(pending);ws4['!cols']=[{wch:32},{wch:20},{wch:14},{wch:14},{wch:12},{wch:22},{wch:18},{wch:60}];ws4['!autofilter']={ref:'A1:H'+pending.length};ws4['!freeze']={xSplit:0,ySplit:1};for(let r=2;r<=pending.length;r++){['F','G'].forEach(col=>{if(ws4[col+r])ws4[col+r].z=moneyFmt})}
 XLSX.utils.book_append_sheet(wb,ws1,'Resumen');XLSX.utils.book_append_sheet(wb,ws2,'Presupuesto detallado');XLSX.utils.book_append_sheet(wb,ws3,'Base de precios');XLSX.utils.book_append_sheet(wb,ws4,'Partidas sin precio');
 const filename='Presupuesto_'+String(project?.name||'ConstructorPro').replace(/[^a-z0-9_-]+/gi,'_')+'.xlsx';XLSX.writeFile(wb,filename,{compression:true});
}function exportTakeoffs(){let rows=state.takeoffs.filter(x=>x.projectId===state.activeProject);download('cubicaciones_constructorpro.csv',csv([['Elemento','Etapa','Nivel','Resultado','Fecha'],...rows.map(x=>[x.name,x.stage,x.level,Object.entries(x.results).map(([k,v])=>k+': '+v).join(' | '),x.date])]))}function exportMaterials(){download('base_precios_constructorpro.csv',csv([['Descripción','Categoría','Unidad','Precio'],...state.materials.map(m=>[m.name,m.category,m.unit,m.price])]))}function exportJson(){download('respaldo_constructorpro.json',JSON.stringify(state,null,2),'application/json;charset=utf-8')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('#exportJson').addEventListener('click',exportJson);$('#newProjectTop').addEventListener('click',()=>{page='projects';render()});render();
})();
